# Tiers for scaffold-project: one line per tier, "NAME extras".
# extras: comma-separated from metrics, decisions, backlog; "-" for none.
# Pass a tier with --tier NAME. Copy to ~/.config/claude-governance/tiers.conf
# (or point GOV_TIERS_CONF at it) and edit to suit.
#
# Example: four tiers that sort projects by why they exist.
REVENUE   metrics,decisions,backlog
INFRA     metrics,decisions
RESEARCH  decisions
PERSONAL  -
